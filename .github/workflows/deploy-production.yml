name: Deploy Production

# Production is promotion, not merge: a revision reaches it by being pushed to
# `prod` after it has run on staging. main deploying straight to production
# would remove the only place a real deploy is observed before it matters.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy Production
    needs: quality
    runs-on: ubuntu-latest
    # Add a required reviewer to this GitHub environment to gate the promotion;
    # the workflow does not encode approval itself, because who may approve is
    # an organisational fact and does not belong in the repository.
    environment:
      name: production
      url: https://alcohol-label-verify.wing-lawrence.workers.dev
    permissions:
      contents: read
      deployments: write
    # Credentials are held by the `production` GitHub environment rather than at
    # repository scope. That is what makes the reviewer above load-bearing: no
    # job can reach the production credential without declaring this environment
    # and passing its gate. Declared once here instead of per step.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # First, and before the checkout: a missing environment secret otherwise
      # surfaces as an opaque wrangler auth error several minutes in.
      - name: Credentials resolved
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?missing — add it under Settings → Environments → production}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing — add it under Settings → Environments → production}"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply D1 migrations
        run: npm run migrate:production

      # Retried once. The Cloudflare API can return a 521 with an HTML body on a
      # trailing call — observed on staging run 30780074509, where the script
      # had already uploaded and the deployment reached 100%, and only the
      # subdomain registration failed. `wrangler deploy` is idempotent, so a
      # second attempt costs an upload and settles whether the failure was the
      # revision or the API. The verification below is the real arbiter either
      # way: if the deploy did land, it passes; if it did not, it fails.
      # Push the provider credential BEFORE deploying.
      #
      # Order matters more than it looks: `wrangler secret put` publishes a new
      # version of the worker. Setting it after the deploy would make the
      # version id captured below stale, and the verification would wait for a
      # version that is no longer the live one.
      #
      # The value travels through the environment rather than being
      # interpolated into the command line: a key containing a quote or a
      # backslash would break an inline JSON payload, and a command line is a
      # worse place for a credential than a variable.
      #
      # GitHub names the secret after the vendor; the worker names it after the
      # role it plays, because which vendor fills it is configuration
      # (MODEL_PROVIDER) rather than a fact about the code.
      - name: Push the provider credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::no GEMINI_API_KEY for this environment — worker secrets left untouched"
            exit 0
          fi
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put MODEL_API_KEY --env production

      # Only needed when the gateway has authentication enabled. Absent means
      # the gateway is open and nothing is written, rather than an empty token
      # being installed over a working one.
      - name: Push the gateway token
        env:
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AI_GATEWAY_TOKEN:-}" ]; then
            echo "::notice::no AI_GATEWAY_TOKEN for this environment — assuming an open gateway"
            exit 0
          fi
          printf '%s' "$AI_GATEWAY_TOKEN" | npx wrangler secret put AI_GATEWAY_TOKEN --env production

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          deploy() { npm run deploy:production 2>&1; }
          # Retried once: the Cloudflare API can return a 521 with an HTML body
          # on a trailing call, after the script has already uploaded. `wrangler
          # deploy` is idempotent, so a second attempt settles whether the
          # failure was the revision or the API.
          out=$(deploy) || {
            echo "::warning::first deploy attempt failed — retrying once"
            sleep 15
            out=$(deploy)
          }
          echo "$out"

          # The version this run published. Verification below waits for THIS
          # id to be the one answering, rather than accepting whichever version
          # happens to reply first.
          version=$(printf '%s\n' "$out" | grep -oE 'Current Version ID: [0-9a-fA-F-]{8,}' | tail -1 | sed 's/.*: //')
          [ -n "$version" ] || { echo "::error::could not read the deployed version id"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deployed version $version"

      - name: Verify deployment
        run: |
          set -euo pipefail
          url="https://alcohol-label-verify.wing-lawrence.workers.dev"
          want="${{ steps.deploy.outputs.version }}"

          # Wait for the version just deployed to be the one answering.
          #
          # Cloudflare serves the previous worker for a few seconds after
          # upload. The old loop retried until it received a 200 and then
          # asserted — which meant a healthy PREVIOUS version could satisfy a
          # check about a broken new one. That is not a hypothetical: a
          # deployment misconfigured for its provider passed this gate.
          #
          # No -f, deliberately: a misconfigured deployment answers 503, and its
          # body is exactly what has to be read to know it arrived.
          body=''
          got=''
          for attempt in $(seq 1 15); do
            body=$(curl -sS --max-time 20 "$url/health" || true)
            got=$(printf '%s' "$body" | jq -r '.version // ""' 2>/dev/null || echo '')
            [ "$got" = "$want" ] && break
            echo "attempt $attempt: serving version ${got:-<none>}, waiting for $want"
            sleep 4
          done

          [ "$got" = "$want" ] || {
            echo "::error::the deployed version never became live (still serving ${got:-<none>})"
            exit 1
          }

          echo "$body"
          echo "$body" | jq -e '.status == "ok"' > /dev/null \
            || { echo "::error::/health reported: $(echo "$body" | jq -c '.problems // .')"; exit 1; }
          echo "$body" | jq -e '.environment == "production"' > /dev/null \
            || { echo "::error::deployed worker reports environment $(echo "$body" | jq -r '.environment')"; exit 1; }

          # modelApiKey is absent by design under a binding-authed provider —
          # asserting that every binding is true would fail such a deploy. These
          # five are the ones whose absence a successful upload would hide.
          missing=$(echo "$body" | jq -r '
            .bindings as $b
            | ["staging", "database", "inference", "workQueue", "jobCoordinator"]
            | map(select($b[.] != true)) | join(", ")')
          [ -z "$missing" ] || { echo "::error::missing bindings: $missing"; exit 1; }

          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 20 "$url/health"); then break; fi
            echo "attempt $attempt: /health not healthy yet"
            body=$(curl -sS --max-time 20 "$url/health" || true)
            sleep 5
          done

          echo "$body"
          echo "$body" | jq -e '.status == "ok"' > /dev/null \
            || { echo "::error::/health reported: $(echo "$body" | jq -c '.problems // .')"; exit 1; }
          echo "$body" | jq -e '.environment == "production"' > /dev/null \
            || { echo "::error::deployed worker reports environment $(echo "$body" | jq -r '.environment')"; exit 1; }

          # modelApiKey is absent by design and reports false — asserting that
          # every binding is true would fail every deploy. These five are the
          # ones whose absence a successful upload would otherwise hide.
          missing=$(echo "$body" | jq -r '
            .bindings as $b
            | ["staging", "database", "inference", "workQueue", "jobCoordinator"]
            | map(select($b[.] != true)) | join(", ")')
          [ -z "$missing" ] || { echo "::error::missing bindings: $missing"; exit 1; }

      - name: Verify inference reachable
        run: |
          set -euo pipefail
          url="https://alcohol-label-verify.wing-lawrence.workers.dev"
          body=$(curl -sS --max-time 60 "$url/health/inference" || true)
          echo "$body"

          if echo "$body" | jq -e '.status == "ok"' > /dev/null 2>&1; then
            exit 0
          fi

          # The provider classifies its own failure and reports it; this reads
          # that verdict rather than matching error text.
          #
          # The previous version grepped for "4006", "daily free allocation" and
          # "neurons" — Cloudflare's vocabulary, in a workflow that deploys
          # whichever provider is configured. Pointed at Gemini it failed a
          # sound revision for an exhausted account quota, which is exactly the
          # leak the provider abstraction was built to close and which survived
          # in CI after being fixed in the code.
          fault=$(echo "$body" | jq -r '.fault // "unknown"' 2>/dev/null || echo unknown)
          reason=$(echo "$body" | jq -r '.error // .reason // "unknown"' 2>/dev/null || echo unknown)

          case "$fault" in
            quota-exhausted|rate-limited)
              echo "::warning::inference unverified ($fault): $reason"
              echo "::warning::this is an account condition, not a problem with this revision"
              ;;
            *)
              echo "::error::/health/inference reported [$fault]: $reason"
              exit 1
              ;;
          esac

      # The other dependency no configuration check can prove. Rasterisation is
      # the batch path's entry point (D33) — the model is never shown a PDF text
      # layer, so a browser that cannot render is a batch that cannot start.
      # ~3 s, dominated by browser launch.
      - name: Verify rasterisation reachable
        run: |
          set -euo pipefail
          url="https://alcohol-label-verify.wing-lawrence.workers.dev"

          # Browser Rendering admits roughly 10 new instances per second, so a
          # launch can be refused for reasons that have nothing to do with this
          # revision. One retry, rather than failing a good deploy on contention.
          for attempt in 1 2; do
            if body=$(curl -fsS --max-time 90 "$url/health/raster"); then break; fi
            echo "attempt $attempt: browser launch refused or timed out"
            body=$(curl -sS --max-time 90 "$url/health/raster" || true)
            sleep 10
          done

          echo "$body"

          if echo "$body" | jq -e '.status == "ok"' > /dev/null; then
            # A zero-byte screenshot is a browser that launched and rendered
            # nothing — reported as ok, and useless.
            echo "$body" | jq -e '.bytes > 0' > /dev/null \
              || { echo "::error::rasterisation produced an empty image"; exit 1; }
          else
            reason=$(echo "$body" | jq -r '.error // .reason // "unknown"')
            # A rate limit is a fact about the account on the day, not about
            # this revision: Browser Rendering allows one new browser every 20
            # seconds and 10 minutes of browser time daily. Failing the deploy
            # for it would block shipping code that is entirely sound, and
            # would train people to re-run until it passes. Anything else — a
            # missing binding, a broken launch — still fails.
            if echo "$reason" | grep -qiE '429|rate limit|browser time limit'; then
              echo "::warning::rasterisation unverified: $reason"
              echo "::warning::the account is at its Browser Rendering limit; this does not indicate a problem with this revision"
            else
              echo "::error::/health/raster reported: $reason"
              exit 1
            fi
          fi

  # A deployed revision must be nameable after the fact. The tag is what an
  # audit record's `deployment` reference resolves back to.
  tag-release:
    name: Tag Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="release-$(date -u +'%Y%m%d-%H%M')"
          echo "Creating tag: $TAG_NAME"
          git tag -a "$TAG_NAME" -m "Production deploy of ${GITHUB_SHA}"
          git push origin "$TAG_NAME"
